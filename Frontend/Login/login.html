<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Recruitment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Login/login.css">
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 main-container">     
        <div class="col-md-6 side-image text-center d-none d-md-flex">
            <h1 class="display-4 fw-bold mb-4">Recruit AI</h1>
            <p class="lead">Revolutionizing Recruitment through <br> Intelligent Automation.</p>
            <div class="mt-4">
                <span class="badge rounded-pill bg-light text-primary px-3 py-2">Smart Screening</span>
                <span class="badge rounded-pill bg-light text-primary px-3 py-2 mx-2">AI Ranking</span>
                <span class="badge rounded-pill bg-light text-primary px-3 py-2">Auto Triage</span>
            </div>
        </div>
        <div class="col-md-6 login-section">
            <div class="login-card">
                <div class="brand-logo text-center text-md-start">Recruit AI</div>
                <p class="text-muted mb-4">Welcome back. Please enter your details.</p>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Login As</label>
                        <select class="form-select form-control" id="userRole">
                            <option value="candidate">Candidate</option>
                            <option value="hr_admin">HR Admin</option>
                            <option value="interviewer">Technical Interviewer</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold small">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                    </div>
                   <div class="mb-3">
                        <label for="password" class="form-label fw-bold small">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" style="border-right:none" id="password" placeholder="Min. 8 characters" required>
                            <span class="input-group-text" style="background:none; border-left:none; border-radius:12px; cursor:pointer" id="togglePassword">
                                <i class="bi bi-eye-slash"></i>
                            </span>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="text-decoration-none small fw-bold" style="color: var(--primary-color);">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>    
                    <p class="text-center small text-muted">
                        Don't have an account? <a href="../signup/signup.html" class="text-decoration-none fw-bold" style="color: var(--primary-color);">Create Account</a>
                    </p>
                </form>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Login/login.js"></script>
</body>
</html>
