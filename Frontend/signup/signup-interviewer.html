<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interviewer Sign Up - RecruitAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 main-container">        
        <div class="col-md-5 side-image d-none d-md-flex text-center">
            <h1 class="display-5 fw-bold">Interviewer</h1>
            <p class="lead">Join our elite panel of experts <br> and evaluate top-tier talent.</p>
        </div>
        <div class="col-md-7 selection-section">
            <div class="signup-card">               
                <div class="brand-logo">Recruit <span>AI</span></div>                
                <h2 class="mb-1 fw-bold" style="color: var(--text-main);">Interviewer Sign Up</h2>
                <p class="text-muted mb-4 small">Share your expertise and start conducting interviews.</p>
                <form id="interviewerForm" class="row g-3" novalidate>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" id="intName" class="form-control" placeholder="Ahmed Ali" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Years of Experience</label>
                        <input type="number" id="experience" class="form-control" placeholder="Ex: 5" min="1" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Primary Expertise</label>
                        <select id="expertise" class="form-select form-control" required>
                            <option value="" selected disabled>Choose your main field...</option>
                            <option value="frontend">Front-end Development (React/Vue)</option>
                            <option value="backend">Back-end Development (Node/Python)</option>
                            <option value="mobile">Mobile Development (Flutter/Native)</option>
                            <option value="devops">DevOps & Cloud</option>
                            <option value="ai">AI & Machine Learning</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Work Email</label>
                        <input type="email" id="intEmail" class="form-control" placeholder="expert@recruitai.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <input type="password" id="intPass" class="form-control" required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" id="toggleIntPass" style="border-radius: 0 12px 12px 0; border-color: #E0E5F2;">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" id="intConfirmPass" class="form-control" required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" id="toggleIntConfirm" style="border-radius: 0 12px 12px 0; border-color: #E0E5F2;">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" id="intBtn" class="btn btn-primary w-100 shadow-sm">
                            <span id="intBtnText">Join us</span>
                            <span id="intLoader" class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4 pb-4">
                    <p class="text-muted small">Not an Interviewer? 
                        <a href="signup.html" class="fw-bold text-decoration-none" style="color: var(--primary-color);">Change Role</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="interviewer-signup.js"></script>
</body>
</html>
