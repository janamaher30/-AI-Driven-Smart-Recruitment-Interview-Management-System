<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Sign Up - RecruitAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 main-container">
        <div class="col-md-5 side-image d-none d-md-flex text-center">
            <h1 class="display-5 fw-bold">Candidate</h1>
            <p class="lead">Build your profile and let our AI match <br> you with the best opportunities.</p>
        </div>
        <div class="col-md-7 selection-section">
            <div class="signup-card">
                <div class="brand-logo">Recruit <span>AI</span></div>               
               <h2 class="mb-1 fw-bold" style="color: var(--text-main);">Create Account</h2>
                <p class="text-muted mb-4 small">Enter your details to set up your professional profile.</p>
                <form id="signupForm" class="row g-3" novalidate>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">First Name</label>
                        <input type="text" id="firstName" class="form-control" placeholder="Ahmed" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Last Name</label>
                        <input type="text" id="lastName" class="form-control" placeholder="Ali" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+20 100 000 0000">
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">LinkedIn Profile (Optional)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"><i class="bi bi-linkedin"></i></span>
                            <input type="url" id="linkedin" class="form-control border-start-0" style="border-radius: 0 12px 12px 0;" placeholder="https://linkedin.com/in/username">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword" style="border-radius: 0 12px 12px 0; border-color: #E0E5F2;">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" id="toggleConfirmPassword" style="border-radius: 0 12px 12px 0; border-color: #E0E5F2;">
                                <i class="bi bi-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label small text-muted" for="terms">
                                I agree to the Terms of Service and Privacy Policy
                            </label>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit" id="signupBtn" class="btn btn-primary w-100 shadow-sm mt-2">
                            <span id="btnText">Create Profile</span>
                            <span id="loader" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4 pb-4">
                    <p class="text-muted small">Not a Candidate? 
                        <a href="signup.html" class="fw-bold text-decoration-none" style="color: var(--primary-color);">Change Role</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="signup.js"></script>
</body>
</html>
